<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7fa;">
    <div style="max-width: 600px; margin: 20px auto; background: #ffffff; color: #1e293b; line-height: 1.7; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h3 style="color: #4f46e5;">Security Verification</h3>
        <p>Hello <span th:text="${name}">User</span>,</p>
        <p>You requested a verification code for your Gyantric CRM account. Use the code below to proceed:</p>
        
        <div style="background: #f8fafc; padding: 30px; text-align: center; border: 1px solid #e2e8f0; border-radius: 12px; margin: 25px 0;">
            <h1 style="margin: 0; color: #4f46e5; font-size: 36px; letter-spacing: 8px; font-family: monospace;" th:text="${otp}">000000</h1>
        </div>
        
        <p style="font-size: 13px; color: #64748b;">This code is valid for 15 minutes. If you did not request this, please secure your account immediately.</p>
        
        <p style="margin-top: 40px; font-size: 14px;">
            Regards,<br/>
            <strong>Gyantric Technologies</strong>
        </p>
    </div>
</body>
</html>
