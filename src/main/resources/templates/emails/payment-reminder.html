<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7fa;">
    <div style="max-width: 600px; margin: 20px auto; background: #ffffff; color: #1e293b; line-height: 1.7; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2 style="color: #ef4444;">Payment Reminder</h2>
        <p>Hello <span th:text="${name}">User</span>,</p>
        <p>This is a reminder that your installment of <strong th:text="${'₹' + amount}">₹0</strong> was due on <strong th:text="${dueDate}">date</strong>.</p>
        
        <div style="background: #fef2f2; padding: 24px; border-left: 4px solid #ef4444; border-radius: 12px; margin: 25px 0;">
            <p style="margin: 0;"><strong>Status:</strong> OVERDUE</p>
            <p style="margin: 5px 0;"><strong>Amount Due:</strong> <span th:text="${'₹' + amount}">₹0</span></p>
            <p style="margin: 5px 0;"><strong>Due Date:</strong> <span th:text="${dueDate}">date</span></p>
        </div>
        
        <p>Please complete your payment to avoid any disruption to your service.</p>
        
        <p style="margin-top: 40px; font-size: 14px;">
            Regards,<br/>
            <strong>Gyantric Technologies</strong>
        </p>
    </div>
</body>
</html>
