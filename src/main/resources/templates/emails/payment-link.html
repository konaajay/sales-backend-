<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7fa;">
    <div style="max-width: 600px; margin: 20px auto; background: #ffffff; color: #1e293b; line-height: 1.7; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2 style="color: #4f46e5; margin-bottom: 10px;">Complete Your Admission</h2>
        <p>We're excited to have you join us. To finalize your enrollment, please use the secure payment link below:</p>
        
        <div style="text-align: center; margin: 35px 0;">
            <a th:href="${paymentUrl}" 
               style="background: #4f46e5; color: white; padding: 14px 28px; text-decoration: none; border-radius: 10px; font-weight: 600; display: inline-block;">Pay Now & Complete Admission</a>
        </div>
        
        <p style="font-size: 13px; color: #64748b;">Alternatively, you can copy and paste this link: <br/> 
           <span style="word-break: break-all;" th:text="${paymentUrl}">link</span>
        </p>
        
        <p style="margin-top: 40px; font-size: 14px;">
            Regards,<br/>
            <strong>Gyantric Technologies</strong>
        </p>
    </div>
</body>
</html>
