spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP optimizations for Render Free Tier
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cashfree Payment Gateway (set these as environment variables on AWS EC2)
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.environment=${CASHFREE_ENV:PROD}
cashfree.webhook.url=${CASHFREE_WEBHOOK_URL:https://yourdomain.com/api/payments/webhook/cashfree}

# Frontend URL for payment redirects (set on AWS EC2)
app.frontend-url=${APP_FRONTEND_URL:http://100.30.239.118}
